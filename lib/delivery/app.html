<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>项目模式</title>
    <style>
      :root {
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        color: #223448;
        background: #f5f7fa;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      .retry-node { background: #b53b3b; color: white; border-color: #b53b3b; }
      .retry-node:hover { background: #963030; color: white; }
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        background: white;
        border: 1px solid #d9e1e9;
        border-radius: 7px;
        padding: 7px 14px;
        color: #304659;
        transition: 0.15s;
      }
      button:hover {
        border-color: #10848e;
        background: #f0faf9;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .primary {
        background: #087e8b;
        border-color: #087e8b;
        color: white;
      }
      .primary:hover {
        background: #096c77;
        color: white;
      }
      .danger {
        color: #ad3434;
      }
      .retry-node { background: #b53b3b; color: white; border-color: #b53b3b; }
      .retry-node:hover { background: #963030; color: white; }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #d7e0e9;
        border-radius: 7px;
        background: #fff;
        color: #223448;
        padding: 9px 11px;
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: #087e8b;
        box-shadow: 0 0 0 3px #087e8b12;
      }
      textarea {
        resize: vertical;
        min-height: 95px;
      }
      input[type="checkbox"] {
        width: auto;
        accent-color: #087e8b;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 23px;
        letter-spacing: -0.4px;
      }
      h2 {
        font-size: 17px;
      }
      h3 {
        font-size: 14px;
      }
      .muted {
        color: #7b8897;
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1.6px;
        color: #087e8b;
        font-weight: 650;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .spread {
        justify-content: space-between;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .page {
        max-width: 1400px;
        margin: auto;
        padding: 28px 30px 40px;
      }
      .heading {
        margin-bottom: 24px;
      }
      .heading p {
        color: #748396;
        margin-top: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 18px;
      }
      .card {
        background: #fff;
        border: 1px solid #e1e7ee;
        border-radius: 11px;
        padding: 21px;
        box-shadow: 0 2px 5px #23344703;
      }
      .clickable {
        cursor: pointer;
      }
      .clickable:hover {
        border-color: #6fabb1;
        box-shadow: 0 6px 20px #23344708;
      }
      .card.selected {
        border-color: #087e8b;
        background: #f9fdfd;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 5px;
        background: #eef3f8;
        color: #576d82;
        font-size: 11px;
        padding: 2px 7px;
        white-space: nowrap;
      }
      .badge.good {
        color: #197253;
        background: #eaf7ee;
      }
      .badge.wait {
        color: #9c6818;
        background: #fff4da;
      }
      .badge.bad {
        color: #b54242;
        background: #fff0ed;
      }
      .dot {
        display: inline-block;
        border-radius: 50%;
        width: 6px;
        height: 6px;
        background: currentColor;
      }
      .empty {
        padding: 65px 30px;
        text-align: center;
        border: 1px dashed #d3dfe7;
        border-radius: 12px;
        background: #ffffff80;
        color: #728397;
      }
      .empty h2 {
        color: #30465a;
        margin: 13px 0 7px;
      }
      .empty button {
        margin-top: 20px;
      }
      .stats {
        display: flex;
        gap: 30px;
        margin: 18px 0 0;
        padding-top: 15px;
        border-top: 1px solid #eef1f4;
      }
      .stats strong {
        font-size: 22px;
        display: block;
        font-weight: 600;
      }
      .stats span {
        font-size: 11px;
        color: #8793a1;
      }
      .project-layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 22px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .repo {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #eef2f6;
      }
      .repo:last-child {
        border: 0;
      }
      .repo code {
        font-size: 12px;
        word-break: break-all;
        color: #66788b;
      }
      .section-title {
        margin-bottom: 15px;
      }
      .banner {
        padding: 15px 19px;
        border: 1px solid #cfe4e6;
        background: #eff8f8;
        border-radius: 9px;
        color: #326671;
        font-size: 13px;
      }
      .sep {
        height: 1px;
        background: #e7edf3;
        margin: 16px 0;
      }
      .mono,
      pre,
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        background: #f5f7fa;
        border: 1px solid #e5ebf1;
        border-radius: 7px;
        padding: 14px;
        max-height: 420px;
        overflow: auto;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 13px;
      }
      .table th {
        color: #8a97a5;
        font-size: 11px;
        font-weight: 550;
        padding: 12px 14px;
        border-bottom: 1px solid #e7edf3;
      }
      .table td {
        padding: 14px;
        border-bottom: 1px solid #eef2f6;
      }
      .table tbody tr:hover {
        background: #f6fafa;
        cursor: pointer;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 11px 20px;
        border-radius: 8px;
        box-shadow: 0 5px 25px #18344322;
        background: #223e4a;
        color: #fff;
        z-index: 100;
        max-width: 90%;
        white-space: pre-wrap;
      }
      .toast.error {
        background: #9a3d3d;
      }
      .modal-wrap {
        position: fixed;
        inset: 0;
        background: #172c4050;
        display: grid;
        place-items: center;
        z-index: 50;
        padding: 24px;
        backdrop-filter: blur(2px);
      }
      .modal {
        background: #fff;
        border-radius: 13px;
        width: min(680px, 100%);
        max-height: 90vh;
        overflow: auto;
        box-shadow: 0 18px 80px #10243433;
      }
      .modal.wide {
        width: min(860px, 100%);
      }
      .modal-head {
        padding: 21px 24px;
        border-bottom: 1px solid #e5ebf0;
      }
      .modal-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 17px;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 17px 24px;
        border-top: 1px solid #e5ebf0;
        background: #fafbfd;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field > span,
      .field > label {
        font-size: 12px;
        font-weight: 600;
        color: #597085;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      .repo-fields {
        display: grid;
        grid-template-columns: 110px 1fr 100px 34px;
        gap: 8px;
      }
      .subtle {
        border: 0;
        background: none;
        color: #768a9a;
        padding: 4px 7px;
      }
      .editor-page {
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: white;
      }
      .editor-head {
        padding: 15px 22px;
        border-bottom: 1px solid #e2e9ef;
      }
      .editor-instructions {
        padding: 8px 22px;
        background: #eff8f8;
        color: #42747c;
        font-size: 12px;
        border-bottom: 1px solid #dce9ec;
      }
      .editor-body {
        display: flex;
        min-height: 0;
        flex: 1;
      }
      .canvas {
        flex: 1;
        border: 0;
        min-width: 0;
        height: 100%;
      }
      .inspector > .muted {
        display: block;
        margin: 8px 0;
      }
      .inspector {
        width: 265px;
        flex-shrink: 0;
        background: #f9fbfc;
        border-left: 1px solid #e2e9ef;
        padding: 18px;
        overflow: auto;
      }
      .node-item {
        width: 100%;
        text-align: left;
        margin-top: 10px;
        padding: 12px;
        background: #fff;
      }
      .node-item small {
        display: block;
        color: #8291a0;
      }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        max-height: 220px;
        overflow: auto;
      }
      .choice {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e3eaf0;
        border-radius: 7px;
        padding: 8px;
        font-size: 12px;
      }
      .choice small {
        display: block;
        color: #8b97a5;
        font-size: 10px;
      }
      .run-layout {
        display: grid;
        grid-template-columns: minmax(300px, 0.85fr) minmax(420px, 1.15fr);
        gap: 20px;
      }
      .dag {
        overflow: auto;
        padding: 10px 0;
      }
      .dag svg {
        display: block;
        width: 100%;
        min-width: 380px;
        height: auto;
      }
      .node-detail {
        min-width: 0;
        overflow: visible;
      }
      .quality {
        background: #fffaf0;
        border: 1px solid #f0dcaf;
        padding: 15px;
        border-radius: 8px;
      }
      .pill {
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 20px;
        background: #edf4f5;
        color: #42747c;
      }
      .metric {
        font-variant-numeric: tabular-nums;
      }
      .trail {
        font-size: 12px;
        color: #8b97a5;
        margin-bottom: 10px;
      }
      .artifact {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #ecf0f4;
      }
      .artifact button {
        text-align: left;
        word-break: break-all;
      }
      .inline-error {
        color: #ad3434;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .file-input {
        display: none;
      }
      .dialogue-stream { max-height: min(46vh, 440px); min-height: 160px; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid #e2e9ec; border-radius: 12px; background: #f8fafb; }
      .dialogue-entry { padding: 12px 14px; border-radius: 10px; background: white; border: 1px solid #e6ecee; }
      .dialogue-entry.user { background: #edf7f5; border-color: #cae5dd; }
      .dialogue-entry.notice { background: transparent; border: none; padding: 2px 6px; color: #687a87; font-size: 12px; }
      .dialogue-entry.notice strong { display: none; }
      .dialogue-entry .muted { font-size: 11px; }
      .dialogue-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; margin-top: 7px; }
      .dialogue-attempt { flex-shrink: 0; border: 1px solid #dae5ea; border-radius: 10px; background: #f1f5f7; overflow: hidden; }
      .dialogue-attempt > summary { cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 11px 12px; color: #355565; font-size: 12px; font-weight: 600; list-style: none; }
      .dialogue-attempt > summary::-webkit-details-marker { display: none; }
      .dialogue-attempt > summary::before { content: '▸'; color: #527789; }
      .dialogue-attempt[open] > summary::before { content: '▾'; }
      .dialogue-attempt > summary .muted { margin-left: auto; font-weight: 400; font-size: 11px; }
      .dialogue-attempt-body { display: flex; flex-direction: column; gap: 10px; padding: 0 8px 10px; }
      .dialogue-attempt > summary:focus-visible { outline: 2px solid #477eaf; outline-offset: -2px; }
      .trace-entry { border: 1px solid #e1e8ed; border-radius: 8px; padding: 10px 12px; background: white; }
      .trace-entry summary { cursor: pointer; color: #566d7e; font-size: 12px; }
      .trace-entry summary .badge { margin-left: 8px; }
      .trace-entry pre { max-height: 250px; overflow: auto; font-size: 12px; margin: 10px 0 0; }
      .trace-entry.reasoning { background: #f3f1fa; border-color: #e4def1; }
      .tool-result { border-top: 1px dashed #d8e1e7; padding-top: 10px; }
      .dialogue-question { padding: 16px; border: 1px solid #b9cde3; background: #f1f6fc; color: #244565; border-radius: 12px; }
      .dialogue-question p { margin: 8px 0 12px; line-height: 1.65; }
      .dialogue-options { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
      .dialogue-options button { display: block; width: 100%; text-align: left; justify-content: flex-start; white-space: normal; background: #fff; color: #244565; border: 1px solid #c4d5e6; border-radius: 8px; padding: 10px 14px; }
      .dialogue-options button:hover { background: #e5eef9; border-color: #7e9fc4; }
      .dialogue-options button:focus-visible { outline: 2px solid #477eaf; outline-offset: 2px; }
      .dialogue-options button[aria-pressed="true"] { background: #dceafa; border-color: #477eaf; color: #183d64; }
      .dialogue-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 10px; }
      @media (max-width: 850px) {
        .project-layout,
        .run-layout {
          grid-template-columns: 1fr;
        }
        .page {
          padding: 22px 18px;
        }
        .inspector > .muted {
          display: block;
          margin: 8px 0;
        }
        .inspector {
          width: 220px;
        }
        .fields {
          grid-template-columns: 1fr;
        }
        .repo-fields {
          grid-template-columns: 80px 1fr;
        }
        .choices {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <div id="overlays"></div>
    <script>
      "use strict";
      const page = "__INITIAL_PAGE__",
        $ = (id) => document.getElementById(id),
        root = $("app"),
        overlays = $("overlays");
      let runViewHash = "",
        templates = [],
        projects = [],
        bootstrap = {},
        activeProject = null,
        activeRun = null,
        activeNode = null,
        editor = null,
        editorFrame = null,
        capabilities = [],
        polling = false;
      let nodeTab = 'activity';
      const dialoguePanels = new Map();
      const uuid = () => crypto.randomUUID();
      function el(tag, attrs = {}, ...children) {
        const n = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs)) {
          if (key === "class") n.className = value;
          else if (key.startsWith("on"))
            n.addEventListener(key.slice(2), value);
          else if (key === "checked") n.checked = value;
          else if (key === "disabled") n.disabled = value;
          else if (value !== undefined && value !== null)
            n.setAttribute(key, value);
        }
        for (const child of children.flat(Infinity)) {
          if (child !== null && child !== undefined && child !== false)
            n.append(
              child instanceof Node
                ? child
                : document.createTextNode(String(child)),
            );
        }
        return n;
      }
      const row = (...children) => el("div", { class: "row" }, ...children),
        stack = (...children) => el("div", { class: "stack" }, ...children),
        muted = (text) => el("span", { class: "muted" }, text),
        label = (text, input, hint) => {
          const control = ["INPUT", "SELECT", "TEXTAREA"].includes(
            input.tagName,
          );
          if (control && !input.id) input.id = "field-" + uuid();
          return el(
            "div",
            { class: "field" },
            el(
              control ? "label" : "span",
              control ? { for: input.id } : {},
              text,
            ),
            input,
            hint ? muted(hint) : null,
          );
        };
      function input(value = "", placeholder = "", type = "text") {
        const n = el("input", { type, placeholder });
        n.value = value;
        return n;
      }
      function area(value = "", placeholder = "") {
        const n = el("textarea", { placeholder });
        n.value = value;
        return n;
      }
      function select(options, value) {
        const n = el(
          "select",
          {},
          options.map((o) =>
            el(
              "option",
              { value: typeof o === "string" ? o : o.value },
              typeof o === "string" ? o : o.label,
            ),
          ),
        );
        if (value !== undefined) n.value = value;
        return n;
      }
      function button(text, fn, style = "") {
        return el(
          "button",
          {
            class: style,
            onclick: async (event) => {
              const b = event.currentTarget;
              b.disabled = true;
              try {
                await fn();
              } catch (error) {
                notice(error.message, true);
              } finally {
                b.disabled = false;
              }
            },
          },
          text,
        );
      }
      function notice(text, error = false) {
        document.querySelector(".toast")?.remove();
        const n = el("div", { class: "toast" + (error ? " error" : "") }, text);
        document.body.append(n);
        setTimeout(() => n.remove(), 6000);
      }
      async function api(action, payload = {}) {
        const response = await fetch("/api/workbuddy-delivery", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ action, ...payload }),
        });
        const value = await response.json();
        if (!response.ok || value.error)
          throw new Error(value.error || "请求失败");
        return value;
      }
      async function catalog() {
        const data = await api("catalog");
        templates = data.templates;
        projects = data.projects;
      }
      const names = (id) => projects.find((p) => p.id === id)?.name || "项目";
      const time = (s) =>
        s ? new Date(s).toLocaleString("zh-CN", { hour12: false }) : "—";
      const states = {
        preparing: "准备中",
        ready: "已就绪",
        starting: "启动中",
        running: "运行中",
        recovering: "恢复中",
        execution_succeeded: "执行完成",
        execution_failed: "执行失败",
        preparation_failed: "启动失败",
        interrupted: "已中断",
        canceled: "已取消",
        success: "已完成",
        error: "失败",
        skipped: "未执行",
        pending: "待验收",
        waiting_quality: "待验收",
        waiting_approval: "等待权限确认",
        passed: "验收通过",
        failed: "未通过",
        not_evaluated: "未配置验收",
      };
      function badge(status) {
        return el(
          "span",
          {
            class:
              "badge " +
              (["success", "passed", "execution_succeeded"].includes(status)
                ? "good"
                : [
                      "failed",
                      "error",
                      "execution_failed",
                      "preparation_failed",
                    ].includes(status)
                  ? "bad"
                  : [
                        "pending",
                        "waiting_quality",
                        "waiting_approval",
                        "running",
                        "preparing",
                        "recovering",
                      ].includes(status)
                    ? "wait"
                    : ""),
          },
          el("i", { class: "dot" }),
          states[status] || status,
        );
      }
      function head(title, description, actions = []) {
        return el(
          "div",
          { class: "row spread heading" },
          el(
            "div",
            {},
            el("div", { class: "eyebrow" }, "PROJECT MODE"),
            el("h1", {}, title),
            el("p", {}, description),
          ),
          row(actions),
        );
      }
      function empty(title, description, action) {
        return el(
          "div",
          { class: "empty" },
          el("div", { style: "font-size:32px;color:#7da1ac" }, "◇"),
          el("h2", {}, title),
          el("p", {}, description),
          action,
        );
      }
      function mount(...children) {
        root.replaceChildren(el("div", { class: "page" }, ...children));
      }
      function modal(title, content, onSave, saveText = "保存", wide = false) {
        const wrap = el("div", { class: "modal-wrap" }),
          error = el("div", { class: "inline-error" });
        function close() {
          wrap.remove();
        }
        const cancel = button("取消", close),
          save = button(
            saveText,
            async () => {
              try {
                await onSave();
                close();
              } catch (e) {
                error.textContent = e.message;
                throw e;
              }
            },
            "primary",
          );
        wrap.append(
          el(
            "section",
            {
              class: "modal" + (wide ? " wide" : ""),
              role: "dialog",
              "aria-modal": "true",
              "aria-label": title,
            },
            el("div", { class: "modal-head" }, el("h2", {}, title)),
            el("div", { class: "modal-body" }, content, error),
            el("div", { class: "modal-foot" }, cancel, save),
          ),
        );
        overlays.append(wrap);
        return { close, wrap };
      }
      function download(name, content, type = "application/json") {
        const url = URL.createObjectURL(new Blob([content], { type })),
          a = el("a", { href: url, download: name });
        a.click();

      const flushWaiters = new Map();
      window.addEventListener("message", async (event) => {
        if (
          event.origin === location.origin &&
          event.source === window.parent &&
          event.data?.type === "delivery-prepare-navigation"
        ) {
          try {
            if (overlays.children.length)
              throw new Error("请先保存或取消当前配置。");
            if (editor) await flush();
            window.parent.postMessage(
              { type: "delivery-navigation-ready" },
              location.origin,
            );
          } catch (error) {
            window.parent.postMessage(
              { type: "delivery-navigation-ready", error: error.message },
              location.origin,
            );
          }
          return;
        }
        if (
          event.origin !== location.origin ||
          event.source !== editorFrame?.contentWindow
        )
          return;
        if (event.data?.type === "wf1-ready") {
          editorFrame.contentWindow.postMessage(
            { type: "wf1-session", sessionId: "delivery-editor" },
            location.origin,
          );
          return;
        }
        if (
          event.data?.type === "delivery-configure-node" &&
          event.data.editorId === editor?.editorId
        ) {
          nodeDialog(event.data.nodeId, event.data.section).catch((error) =>
            notice(error.message, true),
          );
          return;
        }
        if (event.data?.type === "delivery-save-result") {
          const waiter = flushWaiters.get(event.data.requestId);
          if (waiter) {
            flushWaiters.delete(event.data.requestId);
            clearTimeout(waiter.timer);
            event.data.ok
              ? waiter.resolve(event.data)
              : waiter.reject(new Error(event.data.error || "保存失败"));
          }
          if (event.data.ok)
            refreshInspector().catch((e) => notice(e.message, true));
        }
      });
      function flush() {
        if (!editorFrame) throw new Error("请先打开模板");
        const requestId = uuid();
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            flushWaiters.delete(requestId);
            reject(new Error("画布尚未就绪，请稍后重试"));
          }, 12000);
          flushWaiters.set(requestId, { resolve, reject, timer });
          editorFrame.contentWindow.postMessage(
            { type: "delivery-flush", requestId },
            location.origin,
          );
        });
      }

            ),

      function qualityCard(run, s) {

            muted("固定检查对象：本次节点输出与代码产物。"),
            s.reviews.map((r) =>

                    "第 " +
                      r.sequence +
                      " 轮 · " +
                      states[r.decision.outcome] +
                      " · " +
                      r.decision.note,

        if (run.status === "running" && s.status === "pending")
          content.append(
            row(
              button("验收通过", () => decide("passed"), "primary"),
              button("不通过", () => decide("failed"), "danger"),

          content.append(
            button("开始新一轮验收", async () => {

            stack(
              label("验收说明", note),
              muted(
                outcome === "passed"
                  ? "通过后将继续执行下游节点。"

            ),

                subjectId: s.id,
                subjectDigest: s.digest,

      async function init() {

          await catalog();

            sessionStorage.removeItem('delivery:return-node');

          }

        } catch (e) {
          notice(e.message, true);
        } finally {
          polling = false;
